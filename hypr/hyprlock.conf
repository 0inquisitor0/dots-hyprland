general {
    disable_loading = true
    hide_cursor = true
}

background {
    monitor =
    path = screenshot # берет текущий фон и размывает его
    color = rgba(25, 25, 25, 1.0)
    blur_passes = 3
    blur_size = 8
}
# --- ЦИФРОВЫЕ ЧАСЫ ---
label {
    monitor =
    # Формат: Часы:Минуты
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# --- ДАТА (под часами) ---
label {
    monitor =
    # Формат: День недели, Число Месяц
    text = cmd[update:1000] echo "$(date +'%A, %d %B')"
    color = rgba(150, 150, 150, 0.8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}


# --- ПОЛЕ ВВОДА ПАРОЛЯ ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.5
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(60, 60, 60, 0.6)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(150, 150, 150, 0.8)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -140 # Чуть ниже поля ввода пароля
    halign = center
    valign = center
}
